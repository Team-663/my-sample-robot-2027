# Phase 0 CI: compile + unit tests (including transition tests) on every PR.
# Sim scenarios, replay regression, and LFS fixtures are Phase 1 (docs/framework/phase-plan.md).
# The job name "build" is the status check to require in the main ruleset.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
